<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/webp" href="/icons/icon_32.webp" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#03033b" />
		<meta name="description" content="Enjoy the original story from 2000 in your browser." />
		<link rel="manifest" href="/manifest.json">
		<title>Tsukihime</title>

		<script>
			if (window.location.pathname === '/') {
				if (!sessionStorage.getItem('app_entry_path')) {
					sessionStorage.setItem('app_entry_path', '/');
					document.documentElement.dataset.preloading = 'disclaimer';
				}
			} else if (!sessionStorage.getItem('app_entry_path')) {
				sessionStorage.setItem('app_entry_path', window.location.pathname);
			}
		</script>
		<style>
			:root {
				--ui-font: "Ubuntu";
				--game-font: "Ubuntu";
			}
			* {
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}
			html {
				font-family: var(--ui-font, system-ui), Arial, sans-serif;
				font-size: 1.1rem;
				line-height: 1.5;
				font-weight: normal;

				color-scheme: light dark;
				color: #e0e3ec;
				background-color: #000000;

				font-synthesis: none;
				text-rendering: optimizeLegibility;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				-webkit-text-size-adjust: 100%;
			}
			body {
				margin: 0;
				display: flex;
				touch-action: manipulation;
			}
			/* Fallbacks sit in their own rule: a minifier drops a second declaration of the
			   same property, and svh/oklch only exist from Chromium 108/111 on. */
			#root {
				background-image: radial-gradient(#00267d 10%, #01001e);
				height: 100vh;
				width: 100vw;
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				isolation: isolate;
				position: relative;
			}
			@supports (height: 100svh) {
				#root { height: 100svh; }
			}
			@supports (background-image: radial-gradient(oklch(0% 0 0), oklch(0% 0 0))) {
				#root {
					background-image: radial-gradient(oklch(0.32 0.16 262 / 1) 10%, oklch(0.12 0.08 268 / 1));
				}
			}
			html[data-preloading='disclaimer'] #root {
				background: black !important;
			}
		</style>
	</head>
	<body>
		<noscript>You need to enable javascript to run this visual novel.</noscript>
		<div id="root"></div>
		<script type="module" src="/src/app/main.tsx"></script>
	</body>
</html>
